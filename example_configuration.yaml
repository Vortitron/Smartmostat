# Smartmostat 0.3.0 example automations.
#
# Smartmostat itself is set up in the UI (Settings > Devices & services).
# These examples assume an entry named "Living room", which creates
# climate.living_room, sensor.living_room_headline,
# sensor.living_room_reason and switch.living_room_price_optimisation.

automation:
  - alias: "Living room: comfort while the TV is on"
    triggers:
      - trigger: state
        entity_id: media_player.living_room_tv
        to: "on"
    actions:
      - action: climate.set_preset_mode
        target:
          entity_id: climate.living_room
        data:
          preset_mode: comfort

  - alias: "Living room: back to schedule after the TV"
    triggers:
      - trigger: state
        entity_id: media_player.living_room_tv
        to: "off"
        for: "00:15:00"
    actions:
      - action: climate.set_preset_mode
        target:
          entity_id: climate.living_room
        data:
          preset_mode: "none"

  - alias: "Living room: away while on holiday"
    triggers:
      - trigger: state
        entity_id: input_boolean.holiday_mode
    actions:
      - action: climate.set_preset_mode
        target:
          entity_id: climate.living_room
        data:
          preset_mode: "{{ 'away' if trigger.to_state.state == 'on' else 'none' }}"

  - alias: "Living room: no price logic on a fixed-price tariff"
    triggers:
      - trigger: state
        entity_id: input_boolean.on_fixed_price_feed
    actions:
      - action: "switch.turn_{{ 'off' if trigger.to_state.state == 'on' else 'on' }}"
        target:
          entity_id: switch.living_room_price_optimisation

  - alias: "Living room: notify when the frost guard heats"
    triggers:
      - trigger: state
        entity_id: sensor.living_room_reason
        to: frost
    actions:
      - action: notify.notify
        data:
          message: "Frost guard is heating the living room: {{ states('sensor.living_room_headline') }}"

  - alias: "Living room: one-off warm-up for guests"
    triggers:
      - trigger: time
        at: "17:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.guests_tonight
        state: "on"
    actions:
      - action: smartmostat.set_override
        target:
          entity_id: climate.living_room
        data:
          temperature: 22
          minutes: 240
